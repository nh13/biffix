plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.16'
}

version = '0.7.0'

// The Nextflow release (and the nf-amazon it defaults to) the plugin compiles against: the oldest
// release biffix runs (engines.rs SUPPORTED), which is also the plugin's declared minimum
// (Plugin-Requires). One jar serves every supported line, since the nf-amazon API it extends is
// unchanged through 26.x.
def nfVersion = '25.10.4'
def amazonVersion = '3.4.4'

// To check that jar on a newer line, `-PtestNextflowVersion=… -PtestNfAmazonVersion=…` (CI's
// plugin-nextflow-lines job) runs the specs on that line's Nextflow and nf-amazon. Only the test
// classpaths change: the main classes, and so the jar and zip, are still built against the above.
def testNfVersion = findProperty('testNextflowVersion')
def testAmazonVersion = findProperty('testNfAmazonVersion')
def testClasspaths = ['testCompileClasspath', 'testRuntimeClasspath']
configurations.matching { it.name in testClasspaths }.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails d ->
        if( d.requested.group != 'io.nextflow' )
            return
        // nf-amazon is a plugin with its own version; every other io.nextflow module is Nextflow's.
        final want = d.requested.name == 'nf-amazon' ? testAmazonVersion : testNfVersion
        if( want )
            d.useVersion(want as String)
    }
}

nextflowPlugin {
    nextflowVersion = nfVersion
    provider = 'Nils Homer'
    description = 'Reports Nextflow run and task events to biffix, maps task containers through the run image map, and runs AWS Batch tasks on the job definitions biffix registered for the run'
    className = 'io.github.nh13.biffix.BiffixPlugin'
    extensionPoints = [
        'io.github.nh13.biffix.BiffixObserverFactory',
        'io.github.nh13.biffix.BiffixContainerResolver',
        'io.github.nh13.biffix.BiffixAwsBatchExecutor'
    ]
    // BiffixAwsBatchExecutor extends nf-amazon's executor, so nf-amazon's classes must be visible to
    // this plugin's class loader (pf4j resolves a plugin's classes through its Plugin-Dependencies)
    // and nf-amazon must start first. A constraint rather than a pin: the runtime layer carries the
    // nf-amazon its Nextflow release defaults to; the API this compiles against is the one below.
    requirePlugins = ["nf-amazon@>=${amazonVersion}".toString()]
}

// The nextflow-plugin Gradle plugin adds the repositories: mavenLocal, Maven Central, then Seqera's
// Maven repository. Nextflow's own modules (io.nextflow, io.seqera) in the releases this builds
// against are published only to Seqera's, and every other module only to Maven Central, so neither
// is asked for the other's. Seqera's repository is an S3 bucket that answers 403, not 404, for a
// module it does not hold, so a module Gradle went on to look for there (when Maven Central
// throttled CI's shared address) failed the build with Seqera's 403s; and Maven Central, asked
// first, would answer 404 for every Nextflow module. Seqera's is found by its URL, as the plugin
// writes it (a plugin bump that moves it shows as Nextflow modules that do not resolve). Any other
// repository (mavenLocal, with a locally published Nextflow or nf-amazon; a mirror an init script
// adds) is left as it is.
repositories.withType(MavenArtifactRepository).configureEach { MavenArtifactRepository repo ->
    final url = repo.url.toString()
    if( url.contains('maven.seqera.io') ) {
        repo.content {
            includeGroupAndSubgroups 'io.nextflow'
            includeGroupAndSubgroups 'io.seqera'
        }
    }
    else if( repo.url.host in ['repo.maven.apache.org', 'repo1.maven.org'] ) {
        repo.content {
            excludeGroupAndSubgroups 'io.nextflow'
            excludeGroupAndSubgroups 'io.seqera'
        }
    }
}

dependencies {
    // nf-amazon's executor and handler, which the biffix executor extends. compileOnly (and so not
    // packaged): at runtime they come from the nf-amazon plugin itself, and a second copy in this
    // plugin's lib/ would be a different AwsBatchExecutor class. From Seqera's Maven repository
    // (added by the nextflow-plugin Gradle plugin), with its AWS SDK v2 dependencies.
    compileOnly "io.nextflow:nf-amazon:${amazonVersion}"
    testImplementation "io.nextflow:nf-amazon:${amazonVersion}"
    // Gradle 9 no longer supplies the JUnit Platform launcher to the test runtime; its version comes
    // from the JUnit BOM Spock brings in.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Spock (Groovy 4, matching Nextflow 25.10 and 26.x) + a JSON-schema validator (draft 2020-12,
    // the draft schemars writes), so the emitted engine events can be checked against the canonical
    // schemas/wire.engine.schema.json.
    testImplementation 'org.spockframework:spock-core:2.5-groovy-4.0'
    testImplementation 'com.networknt:json-schema-validator:3.0.9'
}

test {
    useJUnitPlatform()
    // The specs read the repo's schemas/ (the engine wire schema and the ingest limits): a change
    // there must re-run them, not leave the task up to date.
    inputs.dir(rootProject.file('../../schemas'))
        .withPropertyName('schemas')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

jar {
    manifest {
        // pf4j reads Plugin-License; the nextflow-plugin Gradle plugin writes the other Plugin-* keys.
        attributes 'Plugin-License': 'MIT'
    }
    // The license text travels with the plugin.
    from(rootProject.file('../../LICENSE')) {
        into 'META-INF'
    }
}
