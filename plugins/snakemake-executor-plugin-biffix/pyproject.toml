[project]
name = "snakemake-executor-plugin-biffix"
version = "0.1.0"
description = "Snakemake (>=9.0) executor plugin: runs each job of a biffix single-job run on one host, in its container image through Apptainer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nils Homer" }]
requires-python = ">=3.11"
keywords = ["snakemake", "plugin", "executor", "biffix", "workflow", "apptainer", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    # The range every Snakemake 9 release asks for (9.0.0 through 9.27: >=9.3.2,<10.0), so the
    # plugin installs beside any of them; and what that interface's oldest release asks for.
    "snakemake-interface-executor-plugins>=9.3.2,<10",
    "snakemake-interface-common>=1.17.4,<2",
]

[project.urls]
Homepage = "https://github.com/nh13/biffix"
Repository = "https://github.com/nh13/biffix"
Source = "https://github.com/nh13/biffix/tree/main/plugins/snakemake-executor-plugin-biffix"
Issues = "https://github.com/nh13/biffix/issues"

[dependency-groups]
dev = [
    # Pinned exactly, to the same versions in infra/, docker/coordinator/ and the other Snakemake
    # plugin, so every project lints alike locally and in CI. Dependabot bumps them together
    # (.github/dependabot.yml).
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "validate-pyproject[all]==0.27",
    # A real Snakemake, for the tests that run workflows through the executor. The newest release
    # biffix tests; CI also runs them on the oldest Snakemake 9 and executor interface (the
    # `uv run --with snakemake==9.0.0 …` in README.md's Development section).
    "snakemake==9.27.1",
    # A default storage provider that needs no service, for the test of how jobs reach storage
    # (1.0.6 with Snakemake 9.0.0, whose storage interface is the one before).
    "snakemake-storage-plugin-fs==1.1.3",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict_optional = true
strict_equality = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "exhaustive-match"]

# The executor interface ships no type information.
[[tool.mypy.overrides]]
module = ["snakemake_interface_executor_plugins.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snakemake_executor_plugin_biffix"]

[tool.uv]
# Resolve only releases at least a week old, so a compromised release has time to be caught before
# it is locked. Keep it >= the Dependabot cooldown (7 days, .github/dependabot.yml), or Dependabot
# proposes versions this project refuses to lock.
exclude-newer = "1 week"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG", "N", "LOG", "RUF008", "RUF012", "RUF024"]

[tool.ruff.lint.per-file-ignores]
# Snakemake's plugin registry reads only `typing.Optional` from a settings field's type.
"src/snakemake_executor_plugin_biffix/settings.py" = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
