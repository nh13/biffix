# Keeps the pinned dependencies it can see moving: the SHA-pinned actions (whose `# vX.Y.Z` comments
# Dependabot rewrites with the SHA), the lockfiles and the coordinator's base image digest. Not the
# versions pinned inline in a command, which move by hand: the Dockerfile's `pip install boto3==…`,
# release.yml's `cargo-lambda==…` and ci.yml's actionlint. Each update waits a week after its release
# (`cooldown`), so a compromised release has time to be caught before a PR proposes it.
#
# Every ecosystem joins one multi-ecosystem group, so a week's updates arrive as a single PR rather
# than one per ecosystem; the `ignore` rules below still hold back what moves by hand. Each commit is
# a conventional one, `chore(deps): …` (commit-message may be set only on the group).
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directories: [/ui, /infra]
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # svelte-check (ui/) takes TypeScript 5 or 6 only; TypeScript 7 works with it only under
      # --tsgo, which still needs 6 installed and checks just part of the UI. Drop this once a
      # svelte-check release lists TypeScript 7 in its peerDependencies.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # infra/, docker/coordinator/ and the Snakemake plugin pin the same ruff, pytest, mypy and
  # validate-pyproject; updating the three directories in one PR keeps them equal.
  - package-ecosystem: uv
    directories: [/infra, /docker/coordinator, /plugins/snakemake-logger-plugin-biffix]
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /plugins/nf-biffix
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # nf-amazon is the version the supported Nextflow release ships; it moves with the engine
      # support (crates/biffix-workflow/src/engines.rs, runtime/pins.rs), not on its own.
      - dependency-name: "io.nextflow:*"

  # The base image is pinned by digest under its python:3.12-slim tag; Dependabot refreshes the
  # digest. A Python minor (3.13) changes what the runtime layer installs into, so it is not proposed.
  - package-ecosystem: docker
    directory: /docker/coordinator
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
