# Every check the repo has: Rust format/lint/tests (the CLI on macOS too), the schema-drift check,
# the UI type/lint/test suite plus a generated-types drift gate, the engine-plugin conformance
# tests, the coordinator entrypoint tests, the infra lint/synth tests, and actionlint + shellcheck
# over the workflows and shell scripts. Runs on every pull request and on every push to main. The
# dependency audit is its own workflow, audit.yml.
name: ci

# A branch push runs only through its pull request, so a PR is checked once (push: main covers what
# lands on main).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main are never cancelled, so every commit
# on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust (fmt · clippy · test · schema-drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner ships rustup; the checked-in rust-toolchain.toml pins the channel + components,
      # and the first cargo invocation auto-installs it. No toolchain action needed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all features, warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # All features, so the unit tests behind `aws` (e.g. the ECR tag lookup's request and failure
      # handling, the DescribeJobs mapping) run too; they need no AWS account or database.
      - name: test (all features)
        run: cargo test --workspace --all-features
      - name: schema drift (schemas/*.json vs the Rust source of truth)
        run: cargo xtask emit-schemas --check

  # The `biffix` CLI is the one crate users build on their own machines, often Macs, so it is also
  # linted and tested on macOS (its config-dir and file-permission code is per-platform). macos-15 is
  # the GA arm64 image, pinned rather than macos-latest so an image change is a reviewed edit.
  rust-macos-cli:
    name: rust (biffix-cli on macOS · clippy · test)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy (warnings are errors)
        run: cargo clippy -p biffix --all-targets -- -D warnings
      - name: test
        run: cargo test -p biffix

  # The crates published to crates.io declare an older `rust-version` than the workspace's (the
  # deploy-only crates' AWS SDK and sqlx need a newer rustc). Build them with it against the locked
  # dependencies, so a Dependabot bump that raises the floor fails here: then either raise their
  # `rust-version` or hold the bump. Libraries and binaries only: the CLI's tests link the backend.
  rust-msrv:
    name: rust (msrv)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLISHED: biffix-core biffix-workflow biffix-api biffix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install the published crates' rust-version toolchain
        id: msrv
        run: |
          set -euo pipefail
          # One rust-version across the published crates, so they promise the same rustc.
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r --arg names "$PUBLISHED" \
            '.packages[] | select(.name as $n | $names | split(" ") | index($n)) | .rust_version' | sort -u)
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::the published crates declare different rust-versions: ${versions//$'\n'/ }"
            exit 1
          fi
          rustup toolchain install "$versions" --profile minimal
          echo "toolchain=$versions" >> "$GITHUB_OUTPUT"
      - name: check (all features)
        run: |
          set -euo pipefail
          args=()
          for p in $PUBLISHED; do args+=(-p "$p"); done
          cargo "+${{ steps.msrv.outputs.toolchain }}" check --locked --all-features "${args[@]}"
      # What `cargo publish` would upload, built from the packaged sources alone (a file the package
      # leaves out fails here, not at release).
      - name: package the crates.io crates
        run: cargo package --locked -p biffix-core -p biffix-workflow -p biffix-api -p biffix

  # Every test that applies the migrations (and exercises the Postgres stores, the projection
  # persistence and the ingest path end to end) is `#[ignore]`d so a plain `cargo test` needs no
  # daemon. This job supplies the database and runs exactly those ignored tests, so a SQL error, a
  # bad ALTER ordering, or an edit to an applied migration (sqlx's checksum check) fails here
  # instead of at deploy.
  rust-pg:
    name: rust (postgres-backed tests · migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Mirrors dev/docker-compose.yml's `postgres` service (image and credentials).
        image: postgres:16
        env:
          POSTGRES_USER: biffix
          POSTGRES_PASSWORD: biffix
          POSTGRES_DB: biffix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biffix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BIFFIX_TEST_PG: postgres://biffix:biffix@localhost:5432/biffix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each pg test runs in its own schema (the `isolated_pool` harnesses), so they run in parallel.
      # The suites are modules of each crate's one integration-test binary (`--test it`). The
      # commands are block scalars because a plain YAML scalar cannot hold `:: ` (`pg_store:: …`).
      - name: backend (pg_store · event_sink_pg)
        run: |
          cargo test -p biffix-backend --all-features --test it -- --include-ignored pg_store:: event_sink_pg::
      - name: ingest (store_pg · reconcile_pg · drain_pg)
        run: |
          cargo test -p biffix-ingest --all-features --test it -- --include-ignored store_pg:: reconcile_pg:: drain_pg::

  ui:
    name: ui (generate · check · lint · test · build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The UI's OpenAPI types are generated by running the Rust `biffix-openapi` bin, so this job
      # needs cargo too; rustup honors rust-toolchain.toml on the first invocation.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install
        working-directory: ui
        run: npm ci
      - name: regenerate API types
        working-directory: ui
        run: npm run generate:api
      # Drift gate: the checked-in generated types must match what the backend's OpenAPI doc
      # produces right now. A backend contract change without a regenerate fails here.
      - name: generated types are current
        run: git diff --exit-code -- ui/src/lib/generated/
      # svelte-check reads .svelte-kit/tsconfig.json, which SvelteKit generates; produce it before
      # type-checking (there is no `prepare` script to do it on install).
      - name: svelte-kit sync
        working-directory: ui
        run: npx svelte-kit sync
      - name: svelte-check
        working-directory: ui
        run: npm run check
      - name: prettier
        working-directory: ui
        run: npm run lint
      - name: vitest
        working-directory: ui
        run: npm run test
      - name: playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      # End-to-end checks against the mock API (playwright.config.ts starts both servers).
      - name: playwright
        working-directory: ui
        run: npm run e2e
      - name: build
        working-directory: ui
        run: npm run build

  plugin-snakemake:
    name: plugin · snakemake logger (pytest conformance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: pytest
        working-directory: plugins/snakemake-logger-plugin-biffix
        run: |
          uv sync --locked --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
          uv run pytest

  plugin-snakemake-executor:
    name: plugin · snakemake executor (pytest, snakemake ${{ matrix.snakemake }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The release the project locks (the newest biffix tests), and the oldest Snakemake 9
        # with the oldest executor interface it accepts (and the storage plugin release for its
        # storage interface): the plugin serves every release between.
        include:
          - {snakemake: locked, with: ""}
          - snakemake: 9.0.0
            with: >-
              --with snakemake==9.0.0
              --with snakemake-interface-executor-plugins==9.3.2
              --with snakemake-interface-common==1.17.4
              --with snakemake-storage-plugin-fs==1.0.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: lint
        if: matrix.snakemake == 'locked'
        working-directory: plugins/snakemake-executor-plugin-biffix
        run: |
          uv sync --locked --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
      - name: pytest
        working-directory: plugins/snakemake-executor-plugin-biffix
        env:
          WITH: ${{ matrix.with }}
          # Checked by tests/test_versions.py, so a job that tests another Snakemake fails.
          BIFFIX_TEST_SNAKEMAKE: ${{ matrix.snakemake }}
        # $WITH is word-split on purpose: it is a list of uv options, or nothing. `python -m
        # pytest`, not the project's `pytest` script, whose interpreter is the project's own and so
        # never sees what --with adds.
        run: |
          uv sync --locked --dev
          # shellcheck disable=SC2086
          uv run $WITH python -m pytest

  plugin-nextflow:
    name: plugin · nextflow observer (gradle)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: gradle build + test
        working-directory: plugins/nf-biffix
        run: ./gradlew --no-daemon test

  # One nf-biffix serves every Nextflow line biffix pins
  # (crates/biffix-workflow/src/runtime/pins.rs). The job above builds and tests it against the oldest. This one runs the same specs, on the
  # same main classes, against each newer line's Nextflow and the nf-amazon it defaults to (only
  # the test classpath changes), so a binary break there fails here.
  plugin-nextflow-lines:
    name: plugin · nextflow observer (gradle, nextflow ${{ matrix.nextflow }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nextflow: 26.04.9, nf-amazon: 3.9.3}
          - {nextflow: 26.10.5, nf-amazon: 3.12.1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Each line resolves its own Nextflow and nf-amazon, so it keeps its own Gradle cache, keyed on
      # both. setup-java's `cache: gradle` (the job above keeps it) is keyed on the build files
      # alone, which all three jobs share: the lines restored whichever job saved first and
      # downloaded their own modules on every run, from a Maven Central that throttles CI's shared
      # addresses. setup-gradle's open-source cache provider keys the same way. Restoring by prefix
      # does not grow the cache without bound: Gradle drops modules unused for 30 days.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-nextflow-${{ matrix.nextflow }}-nf-amazon-${{ matrix.nf-amazon }}-${{
            hashFiles('plugins/nf-biffix/**/*.gradle*',
            'plugins/nf-biffix/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-nextflow-${{ matrix.nextflow }}-
      - name: gradle build + test
        working-directory: plugins/nf-biffix
        env:
          NEXTFLOW: ${{ matrix.nextflow }}
          NF_AMAZON: ${{ matrix.nf-amazon }}
        run: >-
          ./gradlew --no-daemon test -PtestNextflowVersion="$NEXTFLOW"
          -PtestNfAmazonVersion="$NF_AMAZON"

  # The coordinator image's entrypoint, run for real against stand-in engines and a stand-in boto3;
  # no Docker build (that is build-coordinator-image.yml).
  coordinator:
    name: coordinator (ruff · mypy · entrypoint pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: ruff + mypy + pytest
        working-directory: docker/coordinator
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
          MYPYPATH=tests/fakes/py uv run mypy --no-warn-unused-configs -p boto3 -p botocore
          uv run pytest

  infra:
    name: infra (ruff · mypy · pytest · synth)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: ruff lint + format check, mypy
        working-directory: infra
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
      # The synth tests shell out to the CDK CLI and reference the UI asset dir. Install the CDK
      # toolchain and stand in a placeholder UI build (synth validates the CFN graph, not UI
      # content — the same rationale as the placeholder Lambda artifacts infra/tests/conftest.py
      # opts in to).
      - name: cdk toolchain
        working-directory: infra
        run: npm ci
      - name: placeholder UI asset for synth
        run: |
          mkdir -p ui/build
          printf '<!doctype html>\n' > ui/build/index.html
      - name: pytest (synth)
        working-directory: infra
        run: uv run pytest
      # CodeBuild's runtime build runs codebuild/runtime/build.sh's zip reading on Python 3.11,
      # whose zipfile refuses zips that the runner's newer Python accepts. Rerun the build-script
      # tests with their zip reading's `python3` as a 3.11 (BIFFIX_TEST_CODEBUILD_PYTHON).
      - name: pytest (runtime-build zip reading on Python 3.11)
        working-directory: infra
        run: |
          uv python install 3.11
          BIFFIX_TEST_CODEBUILD_PYTHON="$(uv python find --no-project 3.11)" \
            uv run pytest tests/test_codebuild_scripts.py
      # publish.yml's scripts (.github/scripts), which run only in a release: lint and test them
      # here with infra's tools, as they have no project of their own.
      - name: release scripts (ruff · mypy · pytest)
        working-directory: infra
        run: |
          uv run ruff check ../.github/scripts
          uv run ruff format --check ../.github/scripts
          uv run mypy --strict ../.github/scripts
          uv run pytest ../.github/scripts

  # The workflows (actionlint, which also shellchecks every `run:` block) and every shell script,
  # including the extensionless pre-push hook.
  lint:
    name: lint (actionlint · shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner ships Go. `go install` at an exact version is checked against the Go checksum
      # database, so no download script or release checksum is kept for actionlint.
      - name: install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # The runner's apt shellcheck is older than what contributors run and flags differently, so
      # install the pinned release (docs/developing.md names the same version) first on PATH, where
      # both the shellcheck step and actionlint's check of `run:` blocks find it.
      - name: install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color
      - name: shellcheck
        run: git ls-files -z '*.sh' .githooks/ | xargs -0 shellcheck -x
