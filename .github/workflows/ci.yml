# Every check the repo has: Rust format/lint/tests (the CLI on macOS too), the schema-drift check,
# the UI type/lint/test suite plus a generated-types drift gate, the engine-plugin conformance
# tests, the coordinator entrypoint tests, the infra lint/synth tests, and actionlint + shellcheck
# over the workflows and shell scripts. Runs on every pull request and on every push to main. The
# dependency audit is its own workflow, audit.yml.
name: ci

# A branch push runs only through its pull request, so a PR is checked once (push: main covers what
# lands on main).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main are never cancelled, so every commit
# on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust (fmt · clippy · test · schema-drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner ships rustup; the checked-in rust-toolchain.toml pins the channel + components,
      # and the first cargo invocation auto-installs it. No toolchain action needed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all features, warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # All features, so the unit tests behind `aws` (e.g. the ECR tag lookup's request and failure
      # handling, the DescribeJobs mapping) run too; they need no AWS account or database.
      - name: test (all features)
        run: cargo test --workspace --all-features
      - name: schema drift (schemas/*.json vs the Rust source of truth)
        run: cargo xtask emit-schemas --check

  # The `biffix` CLI is the one crate users build on their own machines, often Macs, so it is also
  # linted and tested on macOS (its config-dir and file-permission code is per-platform). macos-15 is
  # the GA arm64 image, pinned rather than macos-latest so an image change is a reviewed edit.
  rust-macos-cli:
    name: rust (biffix-cli on macOS · clippy · test)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy (warnings are errors)
        run: cargo clippy -p biffix-cli --all-targets -- -D warnings
      - name: test
        run: cargo test -p biffix-cli

  # Every test that applies the migrations (and exercises the Postgres stores, the projection
  # persistence and the ingest path end to end) is `#[ignore]`d so a plain `cargo test` needs no
  # daemon. This job supplies the database and runs exactly those ignored tests, so a SQL error, a
  # bad ALTER ordering, or an edit to an applied migration (sqlx's checksum check) fails here
  # instead of at deploy.
  rust-pg:
    name: rust (postgres-backed tests · migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Mirrors dev/docker-compose.yml's `postgres` service (image and credentials).
        image: postgres:16
        env:
          POSTGRES_USER: biffix
          POSTGRES_PASSWORD: biffix
          POSTGRES_DB: biffix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biffix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BIFFIX_TEST_PG: postgres://biffix:biffix@localhost:5432/biffix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each pg test runs in its own schema (the `isolated_pool` harnesses), so they run in parallel.
      # The suites are modules of each crate's one integration-test binary (`--test it`). The
      # commands are block scalars because a plain YAML scalar cannot hold `:: ` (`pg_store:: …`).
      - name: backend (pg_store · event_sink_pg)
        run: |
          cargo test -p biffix-backend --all-features --test it -- --include-ignored pg_store:: event_sink_pg::
      - name: ingest (store_pg · reconcile_pg · drain_pg)
        run: |
          cargo test -p biffix-ingest --all-features --test it -- --include-ignored store_pg:: reconcile_pg:: drain_pg::

  ui:
    name: ui (generate · check · lint · test · build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The UI's OpenAPI types are generated by running the Rust `biffix-openapi` bin, so this job
      # needs cargo too; rustup honors rust-toolchain.toml on the first invocation.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install
        working-directory: ui
        run: npm ci
      - name: regenerate API types
        working-directory: ui
        run: npm run generate:api
      # Drift gate: the checked-in generated types must match what the backend's OpenAPI doc
      # produces right now. A backend contract change without a regenerate fails here.
      - name: generated types are current
        run: git diff --exit-code -- ui/src/lib/generated/
      # svelte-check reads .svelte-kit/tsconfig.json, which SvelteKit generates; produce it before
      # type-checking (there is no `prepare` script to do it on install).
      - name: svelte-kit sync
        working-directory: ui
        run: npx svelte-kit sync
      - name: svelte-check
        working-directory: ui
        run: npm run check
      - name: prettier
        working-directory: ui
        run: npm run lint
      - name: vitest
        working-directory: ui
        run: npm run test
      - name: playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      # End-to-end checks against the mock API (playwright.config.ts starts both servers).
      - name: playwright
        working-directory: ui
        run: npm run e2e
      - name: build
        working-directory: ui
        run: npm run build

  plugin-snakemake:
    name: plugin · snakemake logger (pytest conformance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: pytest
        working-directory: plugins/snakemake-logger-plugin-biffix
        run: |
          uv sync --locked --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
          uv run pytest

  plugin-nextflow:
    name: plugin · nextflow observer (gradle)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: gradle build + test
        working-directory: plugins/nf-biffix
        run: ./gradlew --no-daemon test

  # The coordinator image's entrypoint, run for real against stand-in engines and a stand-in boto3;
  # no Docker build (that is build-coordinator-image.yml).
  coordinator:
    name: coordinator (ruff · mypy · entrypoint pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: ruff + mypy + pytest
        working-directory: docker/coordinator
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
          MYPYPATH=tests/fakes/py uv run mypy --no-warn-unused-configs -p boto3 -p botocore
          uv run pytest

  infra:
    name: infra (ruff · mypy · pytest · synth)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: ruff lint + format check, mypy
        working-directory: infra
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run validate-pyproject pyproject.toml
          uv run mypy
      # The synth tests shell out to the CDK CLI and reference the UI asset dir. Install the CDK
      # toolchain and stand in a placeholder UI build (synth validates the CFN graph, not UI
      # content — the same rationale as the placeholder Lambda artifacts infra/tests/conftest.py
      # opts in to).
      - name: cdk toolchain
        working-directory: infra
        run: npm ci
      - name: placeholder UI asset for synth
        run: |
          mkdir -p ui/build
          printf '<!doctype html>\n' > ui/build/index.html
      - name: pytest (synth)
        working-directory: infra
        run: uv run pytest

  # The workflows (actionlint, which also shellchecks every `run:` block) and every shell script,
  # including the extensionless pre-push hook.
  lint:
    name: lint (actionlint · shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner ships Go and shellcheck. `go install` at an exact version is checked against the
      # Go checksum database, so no download script or release checksum is kept here.
      - name: install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
      - name: shellcheck
        run: git ls-files -z '*.sh' .githooks/ | xargs -0 shellcheck -x
