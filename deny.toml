# cargo-deny's checks over the Rust dependency tree (.github/workflows/audit.yml runs them):
# `advisories` (the RustSec database), `licenses`, `bans` and `sources`. Locally:
# `cargo deny --all-features check`.

[graph]
# Every feature, so the tree is the one the Lambdas (`aws`, `pg`) and the tests build.
all-features = true

[advisories]
ignore = [
  # rsa's Marvin timing side channel has no fixed release. rsa is a dev-dependency only: the
  # backend's auth tests sign test JWTs with a throwaway key; no shipped binary links it.
  { id = "RUSTSEC-2023-0071", reason = "dev-dependency only (test JWT signing); no fixed release" },
]

[licenses]
# Permissive licenses compatible with shipping the binaries under MIT.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common in an AWS SDK tree and not worth failing on.
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates depend on each other by path, without a version.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies and no other registries.
unknown-registry = "deny"
unknown-git = "deny"
