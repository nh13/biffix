[package]
name = "biffix"
version.workspace = true
edition.workspace = true
license.workspace = true
# Published: the oldest rustc that builds it against the lockfile, the same in all four published
# crates (CI's rust-msrv job checks both).
rust-version = "1.89"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The tests drive the real backend router, an unpublished dev-dependency, so they cannot build from
# the published package.
exclude = ["tests/"]
keywords = ["bioinformatics", "workflow", "snakemake", "nextflow", "aws-batch"]
categories = ["command-line-utilities", "science"]
description = "Command-line client for biffix, a self-hostable control plane for Snakemake and Nextflow workflows on AWS Batch."

[lints]
workspace = true

# The library keeps its pre-rename name: it exists for the binary and its tests, and one name for
# both a library and a binary collides in `cargo doc`.
[lib]
name = "biffix_cli"
path = "src/lib.rs"

[[bin]]
name = "biffix"
path = "src/main.rs"

[dependencies]
biffix-core.workspace = true
biffix-workflow.workspace = true
# The shared HTTP wire contract (request/response DTOs), consumed without the `openapi` feature so
# the CLI never compiles utoipa.
biffix-api = { workspace = true, features = ["clap"] }
clap.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true
thiserror.workspace = true
open.workspace = true
rand.workspace = true
base64.workspace = true
url.workspace = true
urlencoding.workspace = true
toml.workspace = true
# A presigned upload's body as a refcounted buffer, so a retry never copies it (already in the tree
# via reqwest).
bytes.workspace = true

[target.'cfg(unix)'.dependencies]
# The binary restores the default SIGPIPE disposition so `biffix … | head` ends quietly.
libc.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
proptest.workspace = true
# The e2e test drives the CLI against the REAL backend router instead of a hand-written fake, so a
# wrong endpoint/param/shape is caught by the real handlers. Its doubles are the backend's own
# (`biffix_backend::testing`, under `test-support`), so they behave as the backend's tests pin them.
# No sqlx/aws.
biffix-backend = { path = "../biffix-backend", features = ["test-support"] }
