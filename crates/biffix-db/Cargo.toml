[package]
name = "biffix-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "biffix Postgres layer: migrations, connection, the event-log writer and the projection fold."

[lints]
workspace = true

[features]
# `aws`: resolve the connection URL from Secrets Manager (`url::resolve`), read a secret's string
# (`secrets`) and ask AWS Batch whether a scheduled tick may leave the database asleep
# (`idle::check`). Only the Lambdas and the server turn it on.
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager", "dep:aws-sdk-batch"]
# Test-only surface: the schema-isolated pool (`testing`). Never enabled by a production build; the
# crates' test builds turn it on.
test-support = ["dep:sha2", "dep:hex"]

[dependencies]
biffix-core.workspace = true
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
urlencoding.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-batch = { workspace = true, optional = true }
# `testing` hashes each test's label into a bounded schema name.
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own tests build it with `test-support`.
biffix-db = { path = ".", features = ["test-support"] }
