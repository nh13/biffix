[package]
name = "biffix-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "biffix — the HTTP wire contract (request/response DTOs) shared by the backend and the CLI."

[lints]
workspace = true

[dependencies]
biffix-core.workspace = true
biffix-workflow.workspace = true
# The sample-detection types' JSON Schema (`schemas/samples.schema.json`, written by the xtask).
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# utoipa's `ToSchema` is derived only when the backend turns this on to build the OpenAPI document.
# The CLI depends on this crate without the feature, so it never compiles utoipa.
utoipa = { workspace = true, optional = true }
# The CLI turns this on for `--state` (`clap` feature).
clap = { workspace = true, optional = true }

[features]
openapi = ["dep:utoipa"]
# `clap::ValueEnum` on the filters, for the CLI's flags.
clap = ["dep:clap"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
