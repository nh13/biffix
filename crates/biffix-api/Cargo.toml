[package]
name = "biffix-api"
version.workspace = true
edition.workspace = true
license.workspace = true
# Published: the oldest rustc that builds it against the lockfile, the same in all four published
# crates (CI's rust-msrv job checks both).
rust-version = "1.89"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bioinformatics", "workflow", "snakemake", "nextflow", "aws-batch"]
categories = ["science"]
description = "biffix — the HTTP wire contract (request/response DTOs) shared by the backend and the CLI."

[lints]
workspace = true

[dependencies]
biffix-core.workspace = true
biffix-workflow.workspace = true
# The sample-detection types' JSON Schema (`schemas/samples.schema.json`, written by the xtask).
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# utoipa's `ToSchema` is derived only when the backend turns this on to build the OpenAPI document.
# The CLI depends on this crate without the feature, so it never compiles utoipa.
utoipa = { workspace = true, optional = true }
# The CLI turns this on for `--state` (`clap` feature).
clap = { workspace = true, optional = true }

[features]
openapi = ["dep:utoipa"]
# `clap::ValueEnum` on the filters, for the CLI's flags.
clap = ["dep:clap"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
