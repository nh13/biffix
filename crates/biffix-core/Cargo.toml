[package]
name = "biffix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "biffix RunEvent contract and reducers (canonical source of the wire schema)."

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
hmac.workspace = true
schemars.workspace = true
# RFC 3339 parsing in the EventBridge decoders.
chrono.workspace = true
# Optional: the Lambdas' shared log setup (`telemetry`), behind `lambda`.
tracing-subscriber = { workspace = true, optional = true, features = ["json"] }

[features]
lambda = ["dep:tracing-subscriber"]
# Test-only surface: the `testing` builders. Never enabled by a production build; the crates'
# dev-dependencies (this one's own below included) turn it on for their tests.
test-support = []

[dev-dependencies]
# The crate's own integration tests build it with `test-support`.
biffix-core = { path = ".", features = ["test-support"] }
proptest.workspace = true
